<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#5A7A6B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Academy">
<title>The Annaliesce Academy</title>
<style>
:root{
  --sage:#7A9A8B; --dsage:#4F6F60; --ecru:#F4F1EA; --gold:#D4AF37; --dgold:#7F640C;
  --ink:#2C3531; --white:#fff; --coral:#E07A5F; --good:#1F7A62; --bad:#B8402B;
  --line:#E2DCCD; --soft:#FAF8F3; --shadow:0 2px 10px rgba(44,53,49,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;background:var(--ecru);color:var(--ink);line-height:1.5;font-size:16px}
.wrap{max-width:1040px;margin:0 auto;padding:14px 14px 110px}
h1,h2,h3{line-height:1.2;font-weight:700}
h2{font-size:1.35rem;margin:22px 0 10px;color:var(--dsage)}
h3{font-size:1.1rem}
p{max-width:70ch}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #2F6FEB;outline-offset:2px}
.btn{background:var(--dsage);color:#fff;border:2px solid var(--dsage);border-radius:12px;padding:10px 18px;min-height:44px;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#3a2e00}
.btn.ghost{background:transparent;color:var(--dsage)}
.btn.danger{background:var(--bad);border-color:var(--bad)}
.btn.big{padding:12px 26px;font-size:1.05rem}
.btn.small{padding:6px 12px;min-height:36px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon{background:#fff;border:2px solid var(--line);border-radius:50%;width:44px;height:44px;font-size:1.2rem}
.center{text-align:center;margin:10px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.muted{color:#5c6660;font-size:.92rem}
.card,.module{background:#fff;border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.module{border-top:6px solid var(--c,var(--sage))}

/* header */
#hdr{padding-bottom:6px}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-size:1.7rem;color:var(--dsage);letter-spacing:.2px}
.brand p{color:#5c6660;font-size:.95rem}
.brand .icon{margin-left:auto}
.avbtn{background:none;border:none;padding:0;border-radius:50%}
.av{border-radius:50%;overflow:hidden;border:3px solid var(--gold);background:#fff;flex:none}
.av svg{display:block;width:100%;height:100%}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 8px}
.stat{background:#fff;border:2px solid var(--sage);border-radius:12px;padding:6px 12px;font-size:.95rem}
.stat b{color:var(--dgold)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 6px}
nav button{background:#fff;border:2px solid var(--dsage);color:var(--dsage);border-radius:10px;padding:6px 12px;font-weight:700;min-height:40px}
nav button.on,nav button:hover{background:var(--dsage);color:#fff}
.warn{background:#FFF1E6;border:2px solid var(--coral);border-radius:12px;padding:10px 14px;margin:8px 0}

/* home */
.note{display:flex;gap:14px;align-items:center;justify-content:space-between;background:#FFF8E7;border:2px dashed var(--gold)}
.note p{margin-top:2px}
.modes{display:flex;gap:8px;flex-wrap:wrap}
.mode{background:#fff;border:2px solid var(--gold);border-radius:999px;padding:8px 16px;font-weight:700;color:var(--dgold);min-height:44px}
.mode.on{background:var(--gold);color:#3a2e00}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0}
.wd{background:var(--soft);border:2px solid var(--line);border-radius:10px;text-align:center;padding:6px 0;font-weight:700;font-size:.85rem}
.wd span{display:block;color:#5c6660}
.wd.on{background:#E4F0EA;border-color:var(--sage)}
.wd.today{border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.scard{text-align:left;background:#fff;border:none;border-left:8px solid var(--c);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;width:100%}
.scard:hover{transform:translateY(-2px)}
.scard .ic{font-size:1.6rem}
.scard h3{color:var(--ink);margin:2px 0}
.scard .realm{color:var(--dgold);font-size:.9rem;font-weight:700}
.scard p{font-size:.9rem;color:#4c5650;margin:6px 0}
.scard .prog{font-size:.85rem;font-weight:700;color:var(--dsage)}
.links{margin-top:18px;font-size:.95rem}
.links a{color:#1d4ed8}

/* subject */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:10px 0}
.chip{background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:8px 12px;text-align:left}
.chip b{display:block}
.chip small{color:#5c6660}
.chip.good{border-color:var(--good);background:#E7F4EE}
.chip.mid{border-color:#C79A12;background:#FFF6DA}
.chip.low{border-color:var(--bad);background:#FDECE8}
.chip:hover{border-color:var(--ink)}

/* round */
.round-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.bar{flex:1;height:12px;background:#E8E3D6;border-radius:99px;overflow:hidden}
.bar div{height:100%;background:var(--gold);transition:width .25s}
.qtag{color:var(--dgold);font-weight:700;font-size:.95rem;text-align:center}
.question{font-size:1.3rem;font-weight:700;text-align:center;margin:8px auto 16px;max-width:60ch}
.clue{text-align:center;font-size:1.1rem;margin:0 auto 12px;font-style:italic}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;border:2px solid #CFD8D3;border-radius:14px;padding:12px;font-weight:600;min-height:56px}
.opt .ltr{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ecru);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.opt:hover:not(:disabled){border-color:var(--sage);background:#F2F7F4}
.opt.right{border-color:var(--good);background:#E1F3EA}
.opt.wrong{border-color:var(--bad);background:#FCE7E2}
.opt.chosen{border-color:var(--dsage);background:#E9F0EC}
.opt:disabled{cursor:default}
.feedback{border-radius:12px;padding:12px 14px;margin-bottom:12px}
.feedback.ok{background:#E1F3EA;border:2px solid var(--good)}
.feedback.no{background:#FFF6DA;border:2px solid #C79A12}
.spellrow{display:flex;gap:10px;max-width:460px;margin:8px auto 14px}
.spellrow input{flex:1;font:inherit;font-size:1.2rem;padding:10px 12px;border:2px solid var(--sage);border-radius:12px}
.answer{background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;text-align:center}
.answer b{font-size:1.2rem}

/* results */
.bigscore{font-size:2.6rem;font-weight:700;color:var(--dsage);text-align:center}
.missed{border-top:1px solid var(--line);padding:10px 0}
.missed small{color:#5c6660}
.bd{display:grid;gap:6px;margin:10px 0}
.bd div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding:4px 0}

/* dojo */
.dojo{background:#FFF5F3;border:2px dashed var(--bad)}
.ditem{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #F0D7D2}
.ditem small{color:#6b5b58}

/* avatar & trophies */
.studio{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start}
.studio .pv{position:sticky;top:8px;text-align:center}
.cat{margin-bottom:12px}
.cat h4{margin-bottom:6px;color:var(--dsage)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--soft);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.9rem;font-weight:600}
.pill.sel,.sw.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--gold)}
.sw{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);position:relative}
.lock{position:absolute;right:-4px;bottom:-4px;font-size:.8rem;background:#fff;border-radius:50%;padding:1px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.trophy{background:var(--soft);border:2px solid var(--gold);border-radius:12px;padding:10px;text-align:center;font-size:.85rem}
.trophy .t{font-size:1.7rem}
.trophy.locked{filter:grayscale(1);opacity:.55;border-color:var(--line)}

/* check-in */
.faces{display:flex;gap:8px;margin:6px 0 14px}
.face{font-size:1.9rem;background:#fff;border:3px solid var(--line);border-radius:14px;width:58px;height:58px}
.face.sel{border-color:var(--gold);background:#FFF6DA}
label.q{display:block;font-weight:700;margin:12px 0 4px}
select,textarea,input.f{font:inherit;width:100%;max-width:520px;padding:10px;border:2px solid var(--line);border-radius:10px;background:#fff}
textarea{min-height:90px}

/* parent */
table{width:100%;border-collapse:collapse;margin:8px 0}
th,td{padding:8px;text-align:left;border-bottom:1px solid var(--line);font-size:.95rem}
th{background:var(--soft);color:var(--dsage)}
.scroll{overflow-x:auto}
.tag{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.85rem;font-weight:700}
.tag.good{background:#E1F3EA;color:var(--good)}
.tag.mid{background:#FFF0C2;color:#7a5b00}
.tag.low{background:#FCE0DA;color:var(--bad)}
.tag.none{background:#EEE;color:#555}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0}
.kpi{background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:1.5rem;color:var(--dsage)}

/* pill nav, modal, toast */
#fpill{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:6px 10px;display:flex;gap:4px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:50}
#fpill button{background:none;border:none;color:#fff;font-weight:700;padding:8px 14px;border-radius:999px;min-height:40px}
#fpill button:hover{color:var(--gold)}
#fpill[hidden]{display:none}
.overlay{position:fixed;inset:0;background:rgba(30,36,33,.55);display:grid;place-items:center;padding:16px;z-index:100}
.dialog{background:#fff;border-radius:18px;padding:20px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
.dialog h3{margin-bottom:8px;color:var(--dsage)}
.dialog input,.dialog textarea{display:block;width:100%;margin:8px 0;padding:10px;border:2px solid var(--line);border-radius:10px;font:inherit}
.dbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:200;max-width:92vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast[hidden]{display:none}

/* v3 additions */
.passage{background:var(--soft);border-left:5px solid var(--sage);border-radius:10px;padding:12px 14px;margin:10px 0;white-space:pre-line}
.passage b.pt{display:block;color:var(--dsage);margin-bottom:4px}
pre.code{background:#1f2933;color:#e6edf3;border-radius:10px;padding:12px;overflow-x:auto;margin:10px 0;font:14px/1.5 ui-monospace,Consolas,monospace}
.swatches{display:flex;gap:10px;align-items:center;justify-content:center;margin:10px 0;font-weight:800;font-size:1.4rem}
.swatches i{display:inline-block;width:64px;height:64px;border-radius:14px;border:2px solid var(--line)}
.hintbox{background:#FFF8E7;border:2px dashed var(--gold);border-radius:12px;padding:8px 12px;margin:10px 0}
.tiers{display:flex;gap:14px;flex-wrap:wrap;font-weight:700;margin:6px 0}
.streak{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.streak .big{font-size:2.2rem;font-weight:800;color:var(--dgold)}
.meter{height:12px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0}
.meter div{height:100%;background:var(--gold)}
.ladder{display:grid;gap:8px}
.rung{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--soft)}
.rung.got{background:#E4F0EA;border-color:var(--sage)}
.rung .d{font-size:1.4rem}
.rung.locked{opacity:.8}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.tok{background:#fff;border:2px solid var(--dsage);color:var(--dsage);border-radius:10px;padding:8px 14px;font-weight:700;min-height:44px;text-align:left}
.tok.used{opacity:.3}
.ordline{min-height:56px;border:2px dashed var(--sage);border-radius:12px;padding:8px;margin:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ordline.col{flex-direction:column;align-items:stretch}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mit{display:block;width:100%;background:#fff;border:2px solid var(--sage);border-radius:10px;padding:10px;margin-bottom:8px;text-align:left;font-weight:600;min-height:48px}
.mit.sel{border-color:var(--gold);background:#FFF8E7}
.mit.ok{background:#E1F3EA;border-color:var(--good);opacity:.7}
.vitem{border-bottom:1px solid var(--line);padding:8px 0}
.vitem b{color:var(--dsage);font-size:1.05rem}
.vitem em{color:#5c6660}
.vitem small{color:#7a6a20}
details.note-d{border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px;background:#fff}
details.note-d summary{font-weight:700;cursor:pointer;color:var(--dsage)}
.hook{background:#FFF8E7;border:2px solid var(--gold);border-radius:10px;padding:6px 10px;margin-top:8px;font-weight:700}
.timer{font-weight:800;font-size:1.4rem;color:var(--dgold)}
.av.golden{border-color:#F5C518;box-shadow:0 0 0 3px #FFF3B0,0 0 14px #F5C518}
.buddy{display:flex;gap:12px;align-items:center}
.buddy .pet{font-size:2.4rem}
.ws li{margin:0 0 16px 24px}
.ws .ans{display:inline-block;border-bottom:1px solid #999;min-width:140px}
.sect{margin-top:14px}
.sect h3{margin-bottom:6px}
.flashface{font-size:1.5rem;font-weight:800;text-align:center;margin:8px 0}
.vhead{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.vhead input{flex:1;min-width:180px;padding:10px;border:2px solid var(--line);border-radius:10px;font:inherit}
@media print{.ws-break{page-break-before:always}}
@media (max-width:640px){
  .mcols{grid-template-columns:1fr}
  .options{grid-template-columns:1fr}
  .studio{grid-template-columns:1fr}
  .studio .pv{position:static}
  .brand h1{font-size:1.35rem}
  .note{flex-direction:column;align-items:flex-start}
  .stats,nav{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .stat,nav button{white-space:nowrap}
  .stat{padding:4px 10px;font-size:.88rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.scard:hover{transform:none}}
@media print{
  #fpill,nav,.stats,.no-print,#toast,.icon,.avbtn{display:none!important}
  body{background:#fff}.card,.module{box-shadow:none;border:1px solid #ccc}
}
</style>
</head>
<body>
<div class="wrap">
  <header id="hdr"></header>
  <main id="view"></main>
</div>
<div id="fpill" hidden></div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="impfile" accept="application/json,.json" hidden>
<script>
/* =====================================================================
   THE ANNALIESCE ACADEMY
   ---------------------------------------------------------------------
   Change CURRENT_YEAR_GROUP to 8 when she moves up. Her Year 7 totals are
   archived (Parent Desk > Year archive) and the new year starts fresh.
   You will also need a BANKS[8] question set (see the notes in the
   question banks section).
   ===================================================================== */
const CURRENT_YEAR_GROUP = 7;
const STORE_KEY = 'annaliesce_academy_v2';
const ROUND_FULL = 15, ROUND_QUICK = 5, TEST_LEN = 20, MOCK_LEN = 39;
const XP_CORRECT = 10, COINS_CORRECT = 2;
const OAK = 'https://www.thenational.academy/pupils/years/year-7/subjects';
const BITE = 'https://www.bbc.co.uk/bitesize';

const SUBJECTS = [
 {k:'maths',n:'Maths',realm:'Annalytica: The Math Arcade',i:'📐',c:'#B38F1D',d:'Place value, the four operations, fractions, percentages, ratio, algebra, geometry and statistics. Endless practice and a timed sprint.'},
 {k:'english',n:'English',realm:"The Scribblers' Guild & Lexicon Vault",i:'✍️',c:'#5A7A6B',d:'Reading, sentence types, punctuation, spelling, vocabulary, spelling dictation and creative writing.'},
 {k:'science',n:'Science',realm:"Annaliesce's Wonder Lab",i:'⚗️',c:'#3A86FF',d:'Cells, body systems, particles, elements, forces, energy, light, sound and space. Top 30 key words.'},
 {k:'history',n:'History',realm:"The Time Travelers' Archives",i:'🏰',c:'#8C5A2B',d:'1066, castles, feudalism, the Church, Magna Carta, timelines and judging sources.'},
 {k:'geography',n:'Geography',realm:'Atlas & Odyssey',i:'🌍',c:'#2E8B57',d:'Map skills, rivers, coasts, weathering, weather, climate and biomes.'},
 {k:'re',n:'RE',realm:'Philosophy Pocket',i:'🕊️',c:'#8E6BBF',d:'World faiths, sacred texts, festivals, ethics and moral dilemmas.'},
 {k:'computing',n:'Computing',realm:'CodeCraft Core',i:'💻',c:'#457B9D',d:'Computational thinking, algorithms, logic gates, binary, web basics and debugging.'},
 {k:'dt',n:'Design & Technology',realm:"Maker's Workshop",i:'🛠️',c:'#C2703D',d:'Materials, smart materials, tools, manufacturing, sustainability and the design process.'},
 {k:'art',n:'Art & Design',realm:'The Canvas & Colour Studio',i:'🎨',c:'#E76F51',d:'Colour theory, tone, perspective, observational drawing and artists.'},
 {k:'music',n:'Music',realm:'Rhythm & Resonance',i:'🎵',c:'#D1478C',d:'The elements of music, notation, dynamics, tempo, instruments and a listening lab.'},
 {k:'pshe',n:'PSHE & Well-being',realm:'Mind & Mojo Station',i:'💛',c:'#E0A100',d:'Growth mindset, feelings, friendships, online safety and resilience.'},
 {k:'spanish',n:'Spanish',realm:'Plaza de Palabras',i:'🇪🇸',c:'#7209B7',d:'Vocabulary, verbs, tú and usted, slang, reading and sentence building, with audio.',lang:'es-ES'}
];
const EXTRA = {k:'mandarin',n:'Mandarin',realm:'The Dragon Script Pavilion',i:'🏮',c:'#C1121F',d:'An extra just for fun: tones, characters and radicals, polite and casual speech, and sentence building, with audio.',lang:'zh-CN'};
const ALLSUBJ = SUBJECTS.concat([EXTRA]);
const subj = k => ALLSUBJ.find(s => s.k === k);

/* =====================================================================
   QUESTION BANKS  (edit this section to add or change questions)
   ---------------------------------------------------------------------
   Each question is one line:
     ["Topic", "Question", "CORRECT answer", "wrong 1", "wrong 2", "wrong 3", "Short explanation"]
   - The correct answer ALWAYS goes first. The page shuffles the answers.
   - You can use 2 or 3 wrong answers.
   - Language subjects (Spanish, Mandarin): put the foreign-language words in
     'single quotes' inside the question so the Listen button can read them.
     Do not use apostrophes in the English part of language questions.
   - If a question needs "double quotes", wrap that whole line in backticks ` `.
   To add Year 8 later: copy the whole BANKS[7] block to BANKS[8], edit it,
   then change CURRENT_YEAR_GROUP at the top of the script to 8.
   ===================================================================== */
const BANKS = {};
BANKS[7] = {

maths: [
["Number","Work out 6 + 3 × 4","18","36","24","12","BIDMAS: multiply first (3 × 4 = 12), then add 6."],
["Number","Round 3.4567 to 2 decimal places","3.46","3.45","3.5","3.457","The third decimal digit is 6, so the 5 rounds up to 6."],
["Number","What is −5 + 8?","3","−13","13","−3","Start at −5 and move 8 up the number line."],
["Number","What is −3 × −4?","12","−12","−7","7","Multiplying two negatives gives a positive."],
["Number","Which of these is a prime number?","37","39","51","57","37 only divides by 1 and itself. 39 = 3 × 13, 51 = 3 × 17 and 57 = 3 × 19."],
["Number","What is the highest common factor (HCF) of 12 and 18?","6","3","36","2","Factors of 12: 1, 2, 3, 4, 6, 12. Factors of 18: 1, 2, 3, 6, 9, 18. The biggest shared factor is 6."],
["Number","What is the lowest common multiple (LCM) of 4 and 6?","12","24","2","10","Multiples of 4: 4, 8, 12. Multiples of 6: 6, 12. The first shared multiple is 12."],
["Number","What is 4³?","64","12","16","81","4³ = 4 × 4 × 4 = 64."],
["Number","What is the square root of 144?","12","14","72","11","12 × 12 = 144."],
["Fractions","What is 3/4 + 1/8?","7/8","4/12","4/8","1/2","Write 3/4 as 6/8, then 6/8 + 1/8 = 7/8."],

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const pct = (c,a) => a ? Math.round(100*c/a) : null;
const rand = a => a[Math.floor(Math.random()*a.length)];
const uniq = a => Array.from(new Set(a));
function mondayOf(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function weekRange(off=0){ const m=mondayOf(new Date()); m.setDate(m.getDate()-7*off); const e=new Date(m); e.setDate(e.getDate()+6); return [ymd(m),ymd(e)]; }
function fmtDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function addDays(s,n){ const [y,m,d]=s.split('-').map(Number); return ymd(new Date(y,m-1,d+n)); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function hash(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); }

/* ---- question index: bank + passages + glossary + vocabulary ---- */
const QIDX = {}, QBY = {};
function addQ(k, o){
  const q = Object.assign({k}, o);
  q.id = o.id || (k+'_'+hash(o.q+'|'+o.correct+'|'+(o.ctx?o.ctx.slice(0,30):'')));
  if(QIDX[q.id]) return QIDX[q.id];
  QIDX[q.id] = q; (QBY[k] = QBY[k] || []).push(q); return q;
}
Object.keys(BANK).forEach(k => BANK[k].forEach(a => {
  let ctx = null; const last = a[a.length-1];
  if(typeof last==='string' && last.indexOf('~sw:')===0){ ctx = last; a = a.slice(0,-1); }
  addQ(k, {topic:a[0], q:a[1], correct:a[2], wrong:a.slice(3,-1), exp:a[a.length-1], ctx});
}));
PASSAGES.forEach(p => p.qs.forEach(a => addQ(p.k, {topic:p.topic, q:a[0], correct:a[1], wrong:a.slice(2,-1), exp:a[a.length-1], ctx:p.text, code:!!p.code, ctxTitle:p.title})));
Object.keys(GLOSS).forEach(k => { const list = GLOSS[k].map(s => s.split('|'));
  list.forEach(([term,def,ex,root],i) => {
    const wr = [3,7,11].map(o => list[(i+o)%list.length][0]);
    addQ(k, {topic:'Key words', q:'Which word means: '+def+'?', correct:term, wrong:wr, gloss:true,
      exp:term+': '+def+'.'+(ex?' Example: '+ex:'')+(root?' (From '+root+'.)':''),
      card:[term, def+(ex?'\n'+ex:'')+(root?'\n('+root+')':'')]});
  });
});
Object.keys(VOCAB).forEach(k => { const zh = k==='mandarin', list = VOCAB[k].split(';').map(s => s.split('|'));
  const lab = it => zh ? it[0]+' ('+it[1]+')' : it[0], eng = it => zh ? it[2] : it[1];
  list.forEach((it,i) => {
    const en = eng(it), label = lab(it), o3 = [3,7,11].map(o => list[(i+o)%list.length]);
    const q1 = addQ(k, {topic:'Vocabulary', q:"What does '"+it[0]+"' mean?", correct:en, wrong:o3.map(eng), exp:label+' means '+en+'.', card:[label,en], vocab:true});
    addQ(k, {topic:'Vocabulary', q:'How do you say '+en+' in '+(zh?'Mandarin':'Spanish')+'?', correct:label, wrong:o3.map(lab), exp:en+' is '+label+'.', cid:q1.id, nocard:true, vocab:true});
  });
});

const defaults = () => ({v:3, year:CURRENT_YEAR_GROUP, led:{}, xp:0, coins:0, cleared:0, hints:0, stats:{}, seen:{}, dojo:{}, cards:{}, rounds:[], days:[], goalWeeks:[], checkins:[], reflections:[], trophies:{}, sr:{}, bestStreak:0, sprintBest:{}, theme:'sage', pet:'cat', avatar:Object.assign({},AV_DEFAULT), owned:{}, spellMiss:[], note:'Super proud of your hard work, Annaliesce! Love, Mum ❤️', pin:'', goal:3, sound:true, mode:'full', archive:{}, at:0, pt:0});
function L(){ let l = S.led[DEVID]; if(!l || l.y!==S.year){ l = S.led[DEVID] = {xp:l?l.xp:0, ce:l?l.ce:0, cs:l?l.cs:0, cl:l?l.cl:0, h:l?l.h:0, st:{}, y:S.year, ver:l?l.ver:0}; } return l; }
function derive(){
  let xp=0, ce=0, cs=0, cl=0, h=0; const st={};
  for(const d in S.led){ const l=S.led[d]; xp+=l.xp||0; ce+=l.ce||0; cs+=l.cs||0; cl+=l.cl||0; h+=l.h||0;
    if(l.y===S.year) for(const k in l.st) for(const t in l.st[k]){ const o=((st[k]=st[k]||{})[t]=st[k][t]||[0,0]); o[0]+=l.st[k][t][0]; o[1]+=l.st[k][t][1]; } }
  S.xp=xp; S.coins=ce-cs; S.cleared=cl; S.hints=h; S.stats=st;
}
function bump(){ L().ver = (L().ver||0)+1; derive(); }
function normalise(){
  S.avatar = Object.assign({}, AV_DEFAULT, S.avatar||{});
  Object.keys(S.dojo).forEach(id => { const d=S.dojo[id]; if(!d.q && !QIDX[id]) delete S.dojo[id]; if(d.t==null) d.t=0; });
}
function load(){
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }catch(e){ storageOK=false; }
  let saved=null; try{ saved = JSON.parse(localStorage.getItem(STORE_KEY)||'null'); }catch(e){}
  S = Object.assign(defaults(), saved||{});
  if(saved && !saved.led) S.led = {[DEVID]:{xp:saved.xp||0, ce:saved.coins||0, cs:0, cl:saved.cleared||0, h:0, st:saved.stats||{}, y:S.year, ver:1}};
  normalise(); derive(); rollover(); syncLoad();
}
let syncTimer;
function save(quiet){
  if(storageOK){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){ storageOK=false; } }

const SYNC_FIELDS = ['v','year','led','seen','dojo','rounds','days','goalWeeks','checkins','trophies','cards','sr','bestStreak','sprintBest','owned','avatar','mode','sound','theme','pet','note','goal','archive','at','pt'];

function mergeInto(a, b){

  m.rounds.sort((x,y)=>(x.t||0)-(y.t||0)); m.rounds = m.rounds.slice(-500);
  const ck = {}; (b.checkins||[]).concat(a.checkins||[]).forEach(c => { if(!ck[c.week] || (c.t||0)>=(ck[c.week].t||0)) ck[c.week]=c; });
  m.checkins = Object.keys(ck).sort().map(w=>ck[w]);
  m.cards = Object.assign({}, b.cards); for(const id in (a.cards||{})) if(!m.cards[id] || (a.cards[id].t||0)>=(m.cards[id].t||0)) m.cards[id]=a.cards[id];
  m.seen = Object.assign({}, b.seen); for(const id in (a.seen||{})){ const s=m.seen[id]; m.seen[id] = s ? [Math.max(s[0],a.seen[id][0]), Math.max(s[1],a.seen[id][1])] : a.seen[id]; }

const SYNC_KEY = 'annaliesce_sync', SYNC_URL = '/.netlify/functions/sync';
let SY = {code:'', last:0, state:'off'}, syncing = false, syncQueued = false;
function syncLoad(){ try{ const o=JSON.parse(localStorage.getItem(SYNC_KEY)||'null'); if(o && o.code){ SY.code=o.code; SY.last=o.last||0; SY.state='idle'; } }catch(e){} }

async function sha256(s){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''); }
function newCode(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r=new Uint8Array(16); crypto.getRandomValues(r); let s=''; r.forEach((x,i)=>{ s+=A[x%32]; if(i%4===3 && i<15) s+='-'; }); return s; }
function normCode(c){ const t=String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,''); return t.length===16 ? t.replace(/(.{4})(?=.)/g,'$1-') : ''; }
async function api(body){ const r = await fetch(SYNC_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}); if(r.status===409) return {conflict:true}; if(!r.ok) throw new Error('http '+r.status); return r.json(); }
function syncUI(){ if(V.name==='parent' || V.name==='home' || V.name==='oasis'){ try{ render(); }catch(e){} } }
function adopt(remote){ S = mergeInto(S, remote); normalise(); derive(); rollover(); applyTheme(); }
async function syncNow(){
  if(!SY.code) return;
  if(!(window.crypto && crypto.subtle)){ SY.state='err'; return; }
  if(syncing){ syncQueued = true; return; }
  syncing = true; SY.state='busy';
  try{
    const key = await sha256(SY.code);
    for(let i=0;i<4;i++){
      const g = await api({a:'get', k:key});
      if(g.state) adopt(g.state);
      const p = await api({a:'put', k:key, etag:g.etag, state:syncable()});
      if(p.conflict) continue;
      SY.last = Date.now(); SY.state='ok'; syncStore(); save(true); syncing=false;
      if(V.name!=='round' && V.name!=='sprint') syncUI();
      if(syncQueued){ syncQueued=false; setTimeout(syncNow,600); }
      return true;
    }
    throw new Error('conflict');
  }catch(e){ SY.state = (navigator.onLine===false) ? 'offline' : 'err'; }
  syncing = false; return false;
}
async function linkCode(code){
  const key = await sha256(code), g = await api({a:'get', k:key});
  if(!g.state) return false;
  SY.code = code; syncStore(); adopt(g.state); save(true); return true;
}
async function startSync(){
  const code = newCode(); SY.code = code; syncStore(); const ok = await syncNow();
  if(!ok){ SY.code=''; SY.state='off'; syncStore(); return null; } return code;
}
async function stopSync(deleteCloud){
  if(deleteCloud && SY.code){ try{ await api({a:'del', k:await sha256(SY.code)}); }catch(e){} }
  SY.code=''; SY.state='off'; SY.last=0; syncStore();
}

function calcStreak(){
  const set = new Set(S.days), d = new Date(), passUsed = {}; let streak = 0;
  if(!set.has(ymd(d))) d.setDate(d.getDate()-1);
  for(let i=0;i<400;i++){
    const s = ymd(d);
    if(set.has(s)) streak++;
    else { const wd=d.getDay(); if(wd!==0 && wd!==6){ const w=ymd(mondayOf(d)); if(!passUsed[w]) passUsed[w]=1; else break; } }
    d.setDate(d.getDate()-1);
  }
  return streak;
}

const TIER = ['New','Bronze','Silver','Gold'], TIER_I = ['🆕','🥉','🥈','🥇'], TIER_XP = [0,2,4,6];
function cardsFor(k, topic){
  const seen = new Set(), out = [];
  (QBY[k]||[]).forEach(q => { if(q.nocard || q.nodojo || q.ctx) return; const cid=q.cid||q.id; if(seen.has(cid)) return; if(topic && q.topic!==topic) return; seen.add(cid); out.push(q); });
  return out;
}

function pickFlash(k, topic, n){
  const t = today(), list = cardsFor(k, topic), c = q => S.cards[q.cid||q.id];
  const due = shuffle(list.filter(q => c(q) && c(q).due<=t)), fresh = shuffle(list.filter(q => !c(q)));
  const rest = list.filter(q => c(q) && c(q).due>t).sort((x,y)=> c(x).due<c(y).due ? -1 : 1);
  return due.concat(fresh, rest).slice(0,n);
}
function cardReview(q, ok){
  const id = q.cid||q.id, c = S.cards[id] || {b:0}, old = c.b, t = today(); let b, xp = 0;
  if(ok){ b = Math.min(3, old+1); xp = b>old ? TIER_XP[b] : 1; c.due = addDays(t, [1,1,3,7][b] + (old===3?7:0)); }
  else { b = Math.max(0, old-1); c.due = t; }
  c.b = b; c.t = Date.now(); S.cards[id] = c;
  return {old, b, xp};
}

const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));

const mn = x => x<0 ? '\u2212'+(-x) : String(x);
function numOpts(ans, fmt){
  fmt = fmt || String;
  const c = shuffle([-ans, ans+1, ans-1, ans+2, ans-2, ans+10, ans-10, ans*2, Math.round(ans/2)].filter(x => x!==ans && Number.isFinite(x)));
  const out = uniq(c).slice(0,3); let d = 3;
  while(out.length<3){ const x = ans+d++; if(!out.includes(x)) out.push(x); }
  return out.map(fmt);
}

function finalize(g, o){
  const q = Object.assign({k:g.k, topic:g.t, gen:1}, o);
  q.correct = String(q.correct); q.wrong = q.wrong.map(String);
  q.id = 'gen_'+g.k+'_'+hash(q.q+'|'+q.correct);
  return q;
}
function genQuestion(g){ return finalize(g, g.f()); }
function genSet(g, n){
  const out = [], seen = new Set(); let guard = 0;
  while(out.length<n && guard++<60){ const q = genQuestion(g); if(q.aural || !seen.has(q.q)){ seen.add(q.q); out.push(q); } }
  return out;
}

function vSubject(m){
  const s=subj(V.k), k=s.k, bank=QBY[k]||[], [a,c]=subjTotals(k), n=roundLen(), gs=gensOf(k), tc=tierCounts(k), nc=cardsFor(k).length;

    return `<button class="chip ${cls}" data-act="topic" data-k="${k}" data-t="${esc(t)}"><b>${esc(t)}</b><small>${cnt} questions, ${p===null?'not tried yet':p+'% right'}</small></button>`; }).join('');
  const study=[];
  if(GLOSS[k]||VOCAB[k]) study.push(`<button class="btn gold" data-act="vault" data-k="${k}">📚 ${VOCAB[k]?'Word vault':'Glossary vault'}</button>`);
  if(NOTES[k]) study.push(`<button class="btn gold" data-act="notes" data-k="${k}">📝 Revision notes</button>`);
  if(GLOSS[k]||VOCAB[k]||MATCHES.some(x=>x.k===k)) study.push(`<button class="btn gold" data-act="mstart" data-k="${k}">🧩 Match-up</button>`);
  if(ORDERS.some(x=>x.k===k)) study.push(`<button class="btn gold" data-act="ostart" data-k="${k}">${OLABEL[k]||'🔢 Put it in order'}</button>`);
  if(JOURNAL[k]) study.push(`<button class="btn gold" data-act="journal" data-k="${k}">${JLABEL[k]}</button>`);
  if(k==='english') study.push(`<button class="btn gold" data-act="dictation">🔊 Spelling dictation</button><button class="btn gold" data-act="go" data-v="thesaurus">📖 Thesaurus vault</button>`);
  if(k==='spanish') study.push(`<button class="btn gold" data-act="go" data-v="verbs">🗂️ Verb tables</button>`);
  if(k==='mandarin') study.push(`<button class="btn gold" data-act="go" data-v="chars">🖌️ Character lab</button>`);
  const endless = gs.length ? `<div class="sect"><h3>♾️ Endless practice: new questions every time</h3><div class="chips">${gs.map(g=>`<button class="btn ghost small" data-act="gen" data-g="${GENS.indexOf(g)}">${esc(g.label)}</button>`).join('')}${k==='maths'?`<button class="btn small" data-act="sprint" data-k="maths">⏱️ 60-second sprint${(S.sprintBest||{}).maths?` (best ${(S.sprintBest||{}).maths})`:''}</button>`:''}${k!=='music'?`<button class="btn ghost small" data-act="worksheet" data-k="${k}">🖨️ Printable worksheet</button>`:''}</div></div>` : '';
  const out = OUTINGS[k] ? `<p class="muted sect">🗺️ Weekend idea (check opening times first): ${esc(OUTINGS[k])}</p>` : '';
  const dc=dojoIds().filter(id=>dojoQ(id).k===k).length;
  m.innerHTML=`<section class="module" style="--c:${s.c}">
   <button class="btn ghost small" data-act="go" data-v="home">← Home</button>
   <h2 style="margin-top:10px">${s.i} ${esc(s.n)}</h2><p class="muted" style="margin-bottom:6px">${esc(s.realm)}. ${esc(s.d)}</p>
   <p>${a?`You have answered ${a} questions here and got ${pct(c,a)}% right.`:'You have not answered any questions here yet.'}${dc?` ${dc} in your Dojo.`:''}</p>
   <div class="row" style="margin:12px 0">
     <button class="btn big" data-act="start" data-k="${k}">Start a round (${Math.min(n,bank.length)} questions)</button>

   ${k==='mandarin'?'':`<p class="links">Revise more: <a href="${OAK}" target="_blank" rel="noopener">Oak National Academy</a> or <a href="${BITE}" target="_blank" rel="noopener">BBC Bitesize</a></p>`}</section>`;

/* ---- questions in a round ---- */
function ctxHTML(q){
  if(!q.ctx) return '';
  if(q.ctx.indexOf('~sw:')===0){ const p=q.ctx.slice(4).split(','); return `<div class="swatches" role="img" aria-label="Two paint colours mixed"><i style="background:${esc(p[0])}"></i>+<i style="background:${esc(p[1])}"></i></div>`; }
  if(q.code) return `<pre class="code">${esc(q.ctx)}</pre>`;
  return `<div class="passage">${q.ctxTitle?`<b class="pt">${esc(q.ctxTitle)}</b>`:''}${esc(q.ctx)}</div>`;
}
function hintOf(q){
  if(q.hint) return q.hint;
  if(q.gloss) return 'It starts with "'+q.correct[0]+'" and has '+q.correct.length+' letters.';
  if(q.vocab) return 'It starts with "'+q.correct[0]+'".';
  const n=NOTES[q.k] && NOTES[q.k][q.topic]; if(n){ const p=n.split('|'); return 'Memory hook: '+p[p.length-1].replace(/^Remember:\s*/,''); }
  return null;
}
function vRound(m){
  if(!R){ go('home'); return; }
  if(R.kind==='sprint'){ vSprint(m); return; }
  const n=R.qs.length, q=R.qs[R.i], s=subj(q.k), noFeedback=(R.kind==='test'||R.kind==='mock'), flash=R.kind==='flash';
  const top=`<div class="round-top"><button class="btn ghost small" data-act="quit">✕ Quit</button><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${R.i}"><div style="width:${(R.i/n)*100}%"></div></div><span>${R.i+1} of ${n}</span></div>`;
  let body='';
  if(q.type==='spell'){
    body=`<div class="qtag">${esc(s.n)}: spelling dictation</div><div class="question">Listen, then type the word you hear.</div>
     <p class="clue">${esc(q.clue)}</p><div class="center"><button class="btn gold" data-act="sayword">🔊 Hear the word</button></div>
     <div class="spellrow"><input id="spellin" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Type the word" value="${q.done?esc(q.typed):''}" ${q.done?'disabled':''}><button class="btn" data-act="spellcheck" ${q.done?'disabled':''}>Check</button></div>`;
  } else if(flash){
    const cd=cardOf(q), t=cardTier(q);
    body=`<div class="qtag">${esc(s.n)}: ${esc(q.topic)}. ${TIER_I[t]} ${TIER[t]}</div><div class="flashface">${esc(cd.f)}</div>
     ${s.lang&&q.vocab?`<div class="center"><button class="btn gold" data-act="listen">🔊 Listen</button></div>`:''}
     ${R.shown?`<div class="answer">${br(cd.b)}</div>
       <div class="row" style="justify-content:center"><button class="btn ghost" data-act="flashno">🔁 Not yet</button><button class="btn" data-act="flashyes">✅ Got it</button></div>
       <p class="muted center">Got it moves a card up: 🥉 Bronze (+2 XP), 🥈 Silver (+4 XP), 🥇 Gold (+6 XP). Not yet moves it down one step.</p>`
      :`<div class="center"><button class="btn big" data-act="flashshow">Show the answer</button></div>`}`;
  } else {
    const hint=!q.done && !noFeedback ? hintOf(q) : null;
    body=`<div class="qtag">${esc(s.n)}: ${esc(q.topic)}</div>${ctxHTML(q)}<div class="question">${esc(q.q)}</div>
     ${q.play?`<div class="center"><button class="btn gold" data-act="playq">▶️ Play the sound</button></div>`:''}
     ${s.lang?`<div class="center"><button class="btn gold" data-act="listen">🔊 Listen</button></div>`:''}
     ${q.hinted&&hint?`<div class="hintbox">💡 ${esc(hint)}</div>`:''}
     ${hint&&!q.hinted?`<div class="center"><button class="btn ghost small" data-act="hint">💡 Hint (half XP for this one)</button></div>`:''}
     <div class="options">`+q.opts.map((o,i)=>{ let cls='opt'; if(q.done){ if(noFeedback){ if(i===q.chosen) cls+=' chosen'; } else if(o===q.correct) cls+=' right'; else if(i===q.chosen) cls+=' wrong'; }
       return `<button class="${cls}" data-act="pick" data-i="${i}" ${q.done?'disabled':''}><span class="ltr">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`; }).join('')+`</div>`;
  }
  let fb='';
  if(q.done && !noFeedback && !flash){
    fb=`<div class="feedback ${q.ok?'ok':'no'}"><strong>${esc(q.msg||'')}</strong>${q.ok?'':`<br>The answer is: <b>${esc(q.correct)}</b>`}<br>${esc(q.exp)}${q.clearedNow?'<br><b>🥋 Cleared from your Dojo!</b>':''}</div>`;
  }
  const next = (q.done && !flash) ? `<div class="center"><button id="nextbtn" class="btn big" data-act="next">${R.i<n-1?'Next ➔':(noFeedback?'Finish':'Finish the round')}</button></div>` : '';
  m.innerHTML=`${top}<section class="module" style="--c:${s.c}">${body}${fb}${next}</section>`;
}
function vSprint(m){
  const q=R.cur, s=subj(q.k), left=Math.max(0,Math.ceil((R.end-Date.now())/1000));
  m.innerHTML=`<div class="round-top"><button class="btn ghost small" data-act="quit">✕ Quit</button><div class="bar"><div id="sbar" style="width:${Math.max(0,(R.end-Date.now())/600)}%"></div></div><span class="timer" id="stime">${left}s</span></div>
   <section class="module" style="--c:${s.c}"><div class="qtag">${esc(s.n)}: 60-second sprint. Score: <b>${R.score}</b> of ${R.qs.length}</div><div class="question">${esc(q.q)}</div>
   <div class="options">${q.opts.map((o,i)=>{ let cls='opt'; if(R.flash){ if(o===q.correct) cls+=' right'; else if(i===R.flash.i) cls+=' wrong'; } return `<button class="${cls}" data-act="sprintpick" data-i="${i}" ${R.flash?'disabled':''}><span class="ltr">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`; }).join('')}</div>
   <p class="muted center">Take your time on each one. A wrong answer only skips ahead, and it goes into your Dojo to practise later.</p></section>`;
}

function vResults(m){
  const sm=R.summary, n=sm.n, c=sm.c, p=pct(c,n), flash=R.kind==='flash', missed=R.qs.filter(q=>q.done&&!q.ok);
  const heads={test:'Checkpoint test finished', mock:'Term mock exam finished', flash:'Flashcards finished', sprint:'Sprint finished'};
  const msg = flash ? `You went through ${n} cards and marked ${c} as known.` : R.kind==='sprint' ? `You got ${c} right in 60 seconds.${sm.newBest?' 🎉 A new personal best!':''}` : p>=90?'Brilliant work! 🌟':p>=70?'Great effort! 💪':p>=50?'Good going. The tricky ones are now in your Dojo to practise.':'That was a tough one. Mistakes are how your brain grows, and the Dojo will help.';
  const list = missed.map(q=> q.type==='spell'
    ? `<div class="missed"><b>${esc(q.word)}</b><br><small>You typed: ${esc(q.typed||'')}</small></div>`
    : `<div class="missed"><b>${esc(flash?cardOf(q).f:q.q)}</b><br>${(R.kind==='test'||R.kind==='mock')&&q.chosen!=null?`<small>You chose: ${esc(q.opts[q.chosen])}</small><br>`:''}Answer: <b>${esc(q.correct)}</b><br><small>${esc(q.exp)}</small></div>`).join('');
  const topics=[...new Set(missed.map(q=>subj(q.k).n+': '+q.topic))];
  const t=(sm.newT||[]), tiers=R.tiers||[0,0,0,0,0];
  const rows=[`<div><span>XP earned</span><b>+${R.xp||0}</b></div>`,`<div><span>Coins earned</span><b>+${R.coins||0}</b></div>`];
  if(flash) rows.push(`<div><span>🥉 to Bronze / 🥈 to Silver / 🥇 to Gold</span><b>${tiers[1]} / ${tiers[2]} / ${tiers[3]}</b></div>`,`<div><span>Cards moved down</span><b>${tiers[4]}</b></div>`);
  if(R.hints) rows.push(`<div><span>💡 Hints used</span><b>${R.hints}</b></div>`);
  if(sm.goalHit) rows.push('<div><span>🎯 Weekly goal reached</span><b>+30 coins</b></div>');
  (sm.rewards||[]).forEach(r=>rows.push(`<div><span>${r.i} Streak reward unlocked</span><b>${esc(r.n)}</b></div>`));
  t.forEach(x=>rows.push(`<div><span>🏆 New trophy</span><b>${esc(x.n)}</b></div>`));
  m.innerHTML=`<section class="module" style="--c:var(--gold)"><div class="qtag">${heads[R.kind]||'Round finished'}</div>
   <div class="bigscore">${R.kind==='sprint'?c:c+' / '+n}</div><p class="center" style="margin-left:auto;margin-right:auto">${msg}</p>
   <div class="bd">${rows.join('')}</div>
   <div class="row" style="justify-content:center;margin-top:12px"><button class="btn big" data-act="again">${R.kind==='sprint'?'Sprint again':'Another round'}</button><button class="btn ghost" data-act="back">Back</button>${dojoCount()?`<button class="btn ghost" data-act="go" data-v="dojo">🥋 Dojo (${dojoCount()})</button>`:''}</div></section>
   ${missed.length?`<section class="card"><h3>${flash?'Cards to look at again':'Have another look at these'}</h3>${list}
     ${topics.length?`<p class="muted" style="margin-top:10px">Topics to revise: ${topics.map(esc).join(', ')}. Try the revision notes, or <a href="${OAK}" target="_blank" rel="noopener">Oak National Academy</a> or <a href="${BITE}" target="_blank" rel="noopener">BBC Bitesize</a>.</p>`:''}</section>`:''}`;
}

function vDojo(m){
  const ids=dojoIds().map(dojoQ), by={};
  ids.forEach(q=>{ (by[q.k]=by[q.k]||[]).push(q); });
  const items=ids.length ? Object.keys(by).map(k=>`<h3 style="margin-top:12px">${subj(k).i} ${esc(subj(k).n)}</h3>`+by[k].map(q=>{ const d=S.dojo[q.id].n; return `<div class="ditem"><div>${esc(q.q)}<br><small>${esc(q.topic)}</small></div><div title="Correct in a row">${'✅'.repeat(d)}${'⬜'.repeat(Math.max(0,2-d))}</div></div>`; }).join('')).join('')
    : '<p>The Dojo is spotless. Any question you get wrong will appear here so you can practise it until it sticks. 🥋</p>';

}

function vThesaurus(m){

/* ---- round engine ---- */
function weightOf(q){ const s=S.seen[q.id]; if(!s) return 3; const d=S.dojo[q.id]; if(d && !d.x) return 3; return s[1]<s[0] ? 2 : 1; }
function weighted(pool, n){
  const out=[], arr=pool.slice();
  while(out.length<n && arr.length){
    const w=arr.map(weightOf), tot=w.reduce((x,y)=>x+y,0);
    let r=Math.random()*tot, i=0;
    for(; i<arr.length-1; i++){ r-=w[i]; if(r<=0) break; }
    out.push(arr.splice(i,1)[0]);
  }
  return out;
}
function pickQuestions(o){
  if(o.kind==='dojo') return weighted(dojoIds().map(dojoQ).filter(Boolean), o.n);
  if(o.kind==='flash') return pickFlash(o.keys[0], o.topic, o.n);
  if(o.gen!=null) return genSet(GENS[o.gen], o.n);
  if(o.keys.length>1){
    const out=[], used=new Set(), ks=shuffle(o.keys); let guard=0;
    while(out.length<o.n && guard++<400){
      const k=ks[out.length % ks.length], cand=(QBY[k]||[]).filter(q=>!used.has(q.id));
      if(!cand.length) continue;
      const q=weighted(cand,1)[0]; used.add(q.id); out.push(q);
    }
    return out;
  }
  let pool=QBY[o.keys[0]]||[];
  if(o.topic) pool=pool.filter(q=>q.topic===o.topic);
  return weighted(pool, o.n);
}
function startRound(o){
  const picked=pickQuestions(o);
  if(!picked.length){ toast(o.kind==='dojo'?'Your Dojo is empty. Nice work!':'No questions available here yet.'); return; }
  R={kind:o.kind, opts:o, subj:o.kind==='dojo'?'mixed':(o.keys&&o.keys.length===1?o.keys[0]:'mixed'), mode:S.mode, back:o.back||{name:'home'},
     qs:picked.map(q=>Object.assign({},q,{opts:shuffle([q.correct].concat(q.wrong)), done:false, ok:false})), i:0, shown:false, xp:0, coins:0, hints:0, tiers:[0,0,0,0,0]};
  go('round');
}
function startDictation(){
  const miss=shuffle(SPELLING.filter(x=>S.spellMiss.includes(x[0]))).slice(0,3);
  const rest=shuffle(SPELLING.filter(x=>!miss.includes(x)));
  const n=S.mode==='quick'?5:8;
  const words=miss.concat(rest).slice(0,n);
  R={kind:'spell', opts:{kind:'spell'}, subj:'english', mode:S.mode, back:{name:'subject',k:'english'}, hints:0, tiers:[0,0,0,0,0],
     qs:words.map(([w,clue])=>({type:'spell', id:'sp_'+w, k:'english', topic:'Spelling dictation', word:w, clue, correct:w, exp:'The correct spelling is "'+w+'".', done:false, ok:false})),
     i:0, xp:0, coins:0};
  go('round'); setTimeout(sayWord,350);
}
function sayWord(){ const q=R&&R.qs[R.i]; if(q && q.type==='spell') speak(q.word,'en-GB'); }
function advance(){ const n=R.qs.length; R.shown=false; if(R.i<n-1){ R.i++; render(); if(R.qs[R.i].type==='spell') setTimeout(sayWord,300); } else finishRound(); }
const bonusFor = (k,n) => (k==='test'||k==='mock') ? 30 : (k==='flash'||k==='dojo'||k==='sprint') ? 10 : 2*n;
function afterActivity(){
  markDay(); const goalHit=checkGoal(), rewards=checkStreak(), newT=checkTrophies(); save();
  if(rewards.length) toast('🎁 Streak reward unlocked: '+rewards.map(r=>r.n).join(', ')+'. See it in Avatar & Rewards.', 5000);
  return {goalHit, rewards, newT};
}
function finishRound(){
  if(!R || R.finished) return; R.finished=true;
  if(R.timer) clearInterval(R.timer);
  const n=R.qs.length, c=R.qs.filter(q=>q.ok).length, k=R.kind;
  if(k==='test'||k==='mock') award(c*XP_CORRECT, c*COINS_CORRECT);
  const bonus=bonusFor(k,n); award(bonus, Math.round(bonus/2));
  let newBest=false;
  if(k==='sprint'){ const prev=(S.sprintBest||{}).maths||0; if(c>prev){ S.sprintBest=S.sprintBest||{}; S.sprintBest.maths=c; newBest=true; } }
  const by={}; if(k!=='flash') R.qs.forEach(q=>{ const b=(by[q.k]=by[q.k]||[0,0]); b[0]++; if(q.ok) b[1]++; });
  S.rounds.push({id:DEVID+'-'+Date.now(), t:Date.now(), d:today(), kind:k, s:R.subj, n, c, by}); S.rounds=S.rounds.slice(-500);
  const a=afterActivity();
  R.summary={n, c, goalHit:a.goalHit, newT:a.newT, rewards:a.rewards, newBest}; go('results');
}
function markDojo(q){ const d=S.dojo[q.id]; if(!d || d.x){ S.dojo[q.id]={n:0, t:Date.now()}; } save(); }

/* ---- 60-second maths sprint ---- */
function newSprintQ(){ const g=rand(gensOf('maths')), q=genQuestion(g); q.opts=shuffle([q.correct].concat(q.wrong)); q.done=false; return q; }
function startSprint(){
  R={kind:'sprint', opts:{kind:'sprint'}, subj:'maths', back:{name:'subject',k:'maths'}, qs:[], score:0, xp:0, coins:0, hints:0, tiers:[0,0,0,0,0], end:Date.now()+60000, lock:false, flash:null};
  R.cur=newSprintQ(); go('round');
  R.timer=setInterval(sprintTick,250);
}
function sprintTick(){
  if(!R || R.kind!=='sprint'){ return; }
  const left=R.end-Date.now(), t=$('#stime'), b=$('#sbar');
  if(t) t.textContent=Math.max(0,Math.ceil(left/1000))+'s';
  if(b) b.style.width=Math.max(0,left/600)+'%';
  if(left<=0) endSprint();
}
function endSprint(){
  if(!R || R.kind!=='sprint' || R.finished) return;
  clearInterval(R.timer);
  if(!R.qs.length){ const b=R.back; R=null; toast("Time is up! Have another go."); go(b.name,b); return; }
  finishRound();
}

/* ---- put-in-order puzzles ---- */
function startOrder(k){
  const sets=ORDERS.filter(x=>x.k===k); if(!sets.length) return;
  let set=rand(sets), guard=0; while(sets.length>1 && V.o && V.o.set===set && guard++<10) set=rand(sets);
  const correct=(set.words||set.items).slice(); let sh=shuffle(correct); guard=0;
  while(sh.every((t,i)=>t===correct[i]) && guard++<20) sh=shuffle(correct);
  V={name:'order', o:{set, correct, toks:sh, chosen:[], tries:0, done:false, ok:false, msg:''}}; render(); window.scrollTo(0,0);
}

/* ---- match-ups ---- */
function autoPairs(k){
  if(VOCAB[k]){ const zh=k==='mandarin', list=VOCAB[k].split(';').map(s=>s.split('|')); return shuffle(list).slice(0,5).map(it=>[zh?it[0]+' ('+it[1]+')':it[0], zh?it[2]:it[1]]); }
  return shuffle((GLOSS[k]||[]).map(s=>s.split('|')).filter(it=>it[1].length<=70)).slice(0,5).map(it=>[it[0],it[1]]);
}
function startMatch(k){
  const cur=MATCHES.filter(x=>x.k===k), auto=!!(GLOSS[k]||VOCAB[k]);
  let pairs, title;
  if(cur.length && (!auto || Math.random()<0.5)){ const set=rand(cur); pairs=set.pairs; title=set.title; }
  else { pairs=autoPairs(k); title='Match each word to its meaning'; }
  const idx=pairs.map((_,i)=>i);
  V={name:'match', m:{k, title, pairs, left:shuffle(idx), right:shuffle(idx), sel:null, done:{}, wrong:0, finished:false, xp:0}}; render(); window.scrollTo(0,0);
}

    modal('Link this device', '<p>Enter the sync code from her first device.</p><input id="sc" type="text" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX-XXXX" aria-label="Sync code">', [{label:'Cancel',cls:'ghost'},{label:'Link',fn:()=>{
      const c=normCode($('#sc').value); if(!c){ toast('The code has 16 letters and numbers.'); return false; }
      linkCode(c).then(ok=>{ if(ok){ SY.state='ok'; syncNow().then(()=>render()); toast('Linked. Her progress is now on this device.',4000); render(); } else toast('No progress found for that code. Check it and try again.',4500); }).catch(()=>toast('Could not reach the sync service.',4500)); }}]);
  },
  syncnow:()=>{ toast('Syncing…'); syncNow().then(()=>render()); },
  syncshow:()=>showCode(SY.code),
  syncstop:()=>modal('Stop syncing on this device?', '<p>Progress stays on this device. It just stops sending and receiving. The cloud copy is kept.</p>', [{label:'Cancel',cls:'ghost'},{label:'Stop syncing',fn:()=>{ stopSync(false).then(()=>{ toast('Syncing stopped on this device.'); render(); }); }}]),
  syncdel:()=>modal('Delete the cloud copy?', '<p>This deletes the copy stored online and stops syncing here. Progress on your devices is not deleted. Other linked devices would upload it again unless you stop syncing on them too.</p>', [{label:'Cancel',cls:'ghost'},{label:'Delete it',cls:'danger',fn:()=>{ stopSync(true).then(()=>{ toast('Cloud copy deleted.'); render(); }); }}])
};
const CHANGES = { goal:el=>{ S.goal=+el.value; S.pt=Date.now(); save(); render(); } };

/* ---- start-up ---- */
document.addEventListener('click', e=>{ const t=e.target.closest('[data-act]'); if(!t) return; const f=ACTIONS[t.dataset.act]; if(f){ audio(); f(t.dataset,t); } });
document.addEventListener('change', e=>{ const t=e.target.closest('[data-chg]'); if(t && CHANGES[t.dataset.chg]) CHANGES[t.dataset.chg](t); });
document.addEventListener('input', e=>{ const t=e.target.closest('[data-inp]'); if(t && t.dataset.inp==='vault'){ const box=$('#vlist'); if(box) box.innerHTML=vaultHTML(V.k, t.value); } });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && $('.overlay')){ closeModal(); return; }
  if(e.key==='Enter'){
    if(e.target && e.target.id==='spellin'){ e.preventDefault(); ACTIONS.spellcheck(); return; }
    if($('.overlay') && e.target && e.target.tagName==='INPUT'){ e.preventDefault(); const bs=$$('.dbtns button'); if(bs.length) bs[bs.length-1].click(); }
  }
});
$('#impfile').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d || typeof d!=='object' || typeof d.xp!=='number' || !d.stats) throw new Error('bad');
      if(!d.led) d.led={[DEVID]:{xp:d.xp, ce:d.coins||0, cs:0, cl:d.cleared||0, h:0, st:d.stats, y:d.year||CURRENT_YEAR_GROUP, ver:1}};
      modal('Replace progress?', '<p>This replaces everything on this device with the backup file. It cannot be undone.</p>', [{label:'Cancel',cls:'ghost'},{label:'Replace',cls:'danger',fn:()=>{ const pin=S.pin; S=Object.assign(defaults(),d); S.pin=d.pin||pin; normalise(); derive(); rollover(); applyTheme(); save(); toast('Backup restored.'); render(); }}]);
    }catch(err){ toast('That file is not a valid Academy backup.'); }
  };
  rd.readAsText(f); e.target.value='';
});
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && SY.code) syncNow(); });
window.addEventListener('online', ()=>{ if(SY.code) syncNow(); });
if('speechSynthesis' in window) try{ speechSynthesis.getVoices(); }catch(e){}
load(); applyTheme(); render();
if(SY.code) syncNow();
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });

</script>
</body>
</html>
